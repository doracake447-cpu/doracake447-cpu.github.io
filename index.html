<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bp-0:#081826; --bp-1:#0b2238; --bp-2:#0f2d4d; --bp-3:#123655;
  --line:#7fdbff; --line-dim:rgba(127,219,255,0.16); --line-dim2:rgba(127,219,255,0.28);
  --cyan:#7fe0ff; --amber:#f2b84b; --amber-dim:rgba(242,184,75,0.35);
  --ink:#eaf4fc; --ink-dim:#9fb8cc; --ink-faint:#5f7d95;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --disp:'Space Grotesk', sans-serif;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--bp-0), var(--bp-0)) fixed,
    repeating-linear-gradient(0deg, var(--line-dim) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--line-dim) 0 1px, transparent 1px 40px);
  background-color:var(--bp-0);
  color:var(--ink);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--amber-dim); color:var(--ink);}
a{color:inherit; text-decoration:none;}

.wrap{ max-width:980px; margin:0 auto; padding:64px 28px 90px; }

.brand{ display:flex; align-items:flex-start; gap:16px; margin-bottom:8px; }
.brand-mark{
  width:46px; height:46px; flex:none; border:1.5px solid var(--cyan); position:relative;
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; color:var(--cyan);
}
.brand-mark::before, .brand-mark::after{ content:""; position:absolute; width:7px; height:7px; border:1px solid var(--cyan); }
.brand-mark::before{ top:-5px; left:-5px; border-right:none; border-bottom:none; }
.brand-mark::after{ bottom:-5px; right:-5px; border-left:none; border-top:none; }
.brand-text h1{ font-family:var(--disp); font-size:32px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em; }
.brand-text p{ margin:0; font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:0.08em; text-transform:uppercase; }

.tagline{
  font-family:var(--body); font-size:14.5px; color:var(--ink-dim); max-width:560px;
  margin:22px 0 36px; line-height:1.65; padding-top:22px; border-top:1px dashed var(--line-dim2);
}

.controls{ display:flex; gap:14px; align-items:center; margin-bottom:30px; flex-wrap:wrap; }
.search-wrap{ position:relative; flex:1; min-width:220px; }
.search-wrap input{
  width:100%; background:var(--bp-1); border:1px solid var(--line-dim2); color:var(--ink);
  font-family:var(--mono); font-size:12.5px; padding:11px 14px 11px 32px; outline:none; transition:border-color .15s;
}
.search-wrap input:focus{ border-color:var(--cyan); }
.search-wrap input::placeholder{ color:var(--ink-faint); }
.search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:11px; height:11px; border:1.5px solid var(--ink-faint); border-radius:50%; }
.search-icon::after{ content:""; position:absolute; width:5px; height:1.5px; background:var(--ink-faint); transform:rotate(45deg); right:-5px; bottom:-1px; }

.cat-filter{
  display:flex; gap:8px; flex-wrap:wrap;
}
.cat-chip{
  font-family:var(--mono); font-size:11px; color:var(--ink-dim); border:1px solid var(--line-dim2);
  padding:7px 12px; cursor:pointer; transition:all .12s; letter-spacing:.03em; text-transform:uppercase;
}
.cat-chip:hover{ border-color:var(--cyan); color:var(--ink); }
.cat-chip.active{ border-color:var(--amber); color:var(--amber); background:rgba(242,184,75,0.08); }

.count-line{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-bottom:18px; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px; }

.card{
  border:1px solid var(--line-dim2);
  background:linear-gradient(180deg, rgba(15,45,77,0.35), rgba(10,31,51,0.15));
  position:relative; display:flex; flex-direction:column; transition:border-color .15s, transform .15s;
}
.card::before{ content:""; position:absolute; top:-1px; left:-1px; width:9px; height:9px; border-top:1.5px solid var(--cyan); border-left:1.5px solid var(--cyan); }
.card::after{ content:""; position:absolute; bottom:-1px; right:-1px; width:9px; height:9px; border-bottom:1.5px solid var(--cyan); border-right:1.5px solid var(--cyan); }
.card:hover{ border-color:var(--cyan); transform:translateY(-2px); }
.card-link{ display:flex; flex-direction:column; height:100%; padding:20px 20px 18px; }
.card-cat{ font-family:var(--mono); font-size:9.5px; color:var(--amber); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
.card-title{ font-family:var(--disp); font-size:19px; font-weight:600; margin:0 0 10px; }
.card-desc{ font-family:var(--body); font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 16px; flex:1; }
.card-foot{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--line-dim2); padding-top:12px; }
.card-open{ color:var(--cyan); }

.empty-state{ padding:70px 20px; text-align:center; color:var(--ink-faint); font-family:var(--mono); font-size:13px; border:1px dashed var(--line-dim2); }

.footer{
  margin-top:60px; padding-top:22px; border-top:1px dashed var(--line-dim2);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  font-family:var(--mono); font-size:11px; color:var(--ink-faint);
}
.manage-link{
  border:1px solid var(--line-dim2); padding:7px 13px; color:var(--ink-dim); transition:all .12s;
}
.manage-link:hover{ border-color:var(--amber); color:var(--amber); }

@media (max-width:600px){
  .wrap{ padding:44px 18px 70px; }
  .brand-text h1{ font-size:26px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">L</div>
    <div class="brand-text">
      <h1>Learn</h1>
      <p>Personal Reference Library</p>
    </div>
  </div>
  <p class="tagline" id="tagline">Loading materials…</p>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon"></span>
      <input id="searchInput" type="text" placeholder="Search materials…" autocomplete="off" />
    </div>
  </div>
  <div class="cat-filter" id="catFilter"></div>

  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>

  <div class="footer">
    <span id="totalCount"></span>
    <a class="manage-link" href="manage.html">+ Add material</a>
  </div>
</div>

<script>
(function(){
  let ALL = [];
  let query = '';
  let activeCat = 'All';

  const grid = document.getElementById('grid');
  const catFilter = document.getElementById('catFilter');
  const countLine = document.getElementById('countLine');
  const totalCount = document.getElementById('totalCount');
  const tagline = document.getElementById('tagline');

  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(){
    const cats = ['All', ...Array.from(new Set(ALL.map(m => m.category || 'General')))];
    catFilter.innerHTML = cats.map(c =>
      `<div class="cat-chip ${c===activeCat?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join('');
    catFilter.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => { activeCat = chip.getAttribute('data-cat'); render(); });
    });

    const q = query.trim().toLowerCase();
    const filtered = ALL.filter(m => {
      const inCat = activeCat === 'All' || (m.category || 'General') === activeCat;
      const inQuery = !q || (m.title + ' ' + (m.description||'')).toLowerCase().includes(q);
      return inCat && inQuery;
    });

    countLine.textContent = `${filtered.length} of ${ALL.length} shown`;
    totalCount.textContent = `${ALL.length} material${ALL.length===1?'':'s'} indexed`;

    grid.innerHTML = filtered.length ? filtered.map(m => `
      <div class="card">
        <a class="card-link" href="${escapeHtml(m.file)}">
          <div class="card-cat">${escapeHtml(m.category || 'General')}</div>
          <h3 class="card-title">${escapeHtml(m.title)}</h3>
          <p class="card-desc">${escapeHtml(m.description || '')}</p>
          <div class="card-foot">
            <span>${escapeHtml(m.date || '')}</span>
            <span class="card-open">open →</span>
          </div>
        </a>
      </div>
    `).join('') : `<div class="empty-state">No materials match your filters.</div>`;
  }

  document.getElementById('searchInput').addEventListener('input', e => { query = e.target.value; render(); });

  fetch('manifest.json', { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('missing manifest.json'); return r.json(); })
    .then(data => {
      ALL = Array.isArray(data) ? data : [];
      tagline.textContent = ALL.length
        ? `${ALL.length} reference${ALL.length===1?'':'s'} — search or filter by category below.`
        : 'No materials yet. Use "+ Add material" to publish your first one.';
      render();
    })
    .catch(err => {
      tagline.textContent = 'Could not load manifest.json.';
      grid.innerHTML = `<div class="empty-state">
        Couldn't load <code>manifest.json</code>.<br><br>
        If you opened this file directly (file://), browsers block local fetches —
        run a local server instead, e.g. <code>python3 -m http.server</code>,
        or view it via your published github.io URL.
      </div>`;
    });
})();
</script>
</body>
</html>
